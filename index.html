<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 마음 기록장 : 쉼표</title>
    <!-- 감성적인 명조체와 고딕체 혼용 -->
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Pretendard:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f2ef; /* 차분한 미색 */
            --card-bg: #ffffff;
            --text-main: #3e3c3a;
            --text-sub: #8e8a86;
            --accent: #a7bbc7; /* 새벽 공기 빛 블루 */
            --point: #e2e2e2;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 1s ease-out;
        }

        header h1 {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 1.8rem;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        /* 입력 카드 박스 */
        .editor-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 50px;
            animation: slideUp 0.8s ease-out;
        }

        .date-display {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 15px;
        }

        .emoji-picker {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .emoji-btn {
            background: none;
            border: 2px solid transparent;
            font-size: 1.5rem;
            cursor: pointer;
            width: 50px;
            height: 50px;
            border-radius: 15px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .emoji-btn:hover {
            transform: translateY(-5px);
            background-color: #f8f9fa;
        }

        .emoji-btn.active {
            background-color: #f0f4f7;
            border-color: var(--accent);
            transform: scale(1.1);
        }

        textarea {
            width: 100%;
            border: 1px solid var(--point);
            border-radius: 12px;
            padding: 15px;
            font-family: inherit;
            font-size: 1rem;
            resize: none;
            height: 100px;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .save-btn {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.2s;
        }

        .save-btn:active {
            transform: scale(0.98);
        }

        /* 타임라인 스타일 */
        .timeline {
            width: 100%;
            max-width: 450px;
            position: relative;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 1px;
            background: var(--point);
        }

        .diary-item {
            position: relative;
            padding-left: 50px;
            margin-bottom: 30px;
            animation: fadeIn 0.6s ease-in-out;
        }

        .diary-item::after {
            content: '';
            position: absolute;
            left: 17px;
            top: 24px;
            width: 7px;
            height: 7px;
            background: var(--accent);
            border-radius: 50%;
        }

        .diary-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 18px;
            box-shadow: var(--shadow);
            transition: transform 0.3s;
        }

        .diary-card:hover {
            transform: translateX(5px);
        }

        .diary-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .diary-info {
            display: flex;
            flex-direction: column;
        }

        .diary-date {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .diary-emoji {
            font-size: 1.2rem;
            margin-top: 4px;
        }

        .diary-content {
            font-size: 0.95rem;
            color: var(--text-main);
            white-space: pre-wrap;
            word-break: break-all;
        }

        .diary-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: flex-end;
        }

        .action-btn {
            background: none;
            border: none;
            font-size: 0.75rem;
            color: var(--text-sub);
            cursor: pointer;
            padding: 5px;
        }

        .action-btn:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        /* 애니메이션 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 삭제 애니메이션 */
        .removing {
            transform: scale(0.9);
            opacity: 0;
            transition: 0.4s;
        }
    </style>
</head>
<body>

    <header>
        <h1>마음 기록, 쉼표</h1>
        <p>오늘의 계절은 어떠했나요?</p>
    </header>

    <div class="editor-card">
        <div class="date-display" id="current-date"></div>
        <div class="emoji-picker">
            <button class="emoji-btn" onclick="selectEmoji('😊', this)">😊</button>
            <button class="emoji-btn" onclick="selectEmoji('😐', this)">😐</button>
            <button class="emoji-btn" onclick="selectEmoji('😔', this)">😔</button>
            <button class="emoji-btn" onclick="selectEmoji('😠', this)">😠</button>
            <button class="emoji-btn" onclick="selectEmoji('✨', this)">✨</button>
        </div>
        <textarea id="diary-input" placeholder="이곳에 당신의 숨을 고르세요..."></textarea>
        <button class="save-btn" id="save-btn">기록하기</button>
    </div>

    <div class="timeline" id="diary-timeline">
        <!-- 기록들이 여기에 추가됩니다 -->
    </div>

    <script>
        let selectedEmoji = '';
        let editingId = null;
        const diaryInput = document.getElementById('diary-input');
        const saveBtn = document.getElementById('save-btn');
        const timeline = document.getElementById('diary-timeline');
        const dateDisplay = document.getElementById('current-date');

        // 초기화
        document.addEventListener('DOMContentLoaded', () => {
            setCurrentDate();
            loadDiaries();
        });

        // 날짜 설정
        function setCurrentDate() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            dateDisplay.innerText = now.toLocaleDateString('ko-KR', options);
        }

        // 감정 선택
        function selectEmoji(emoji, btn) {
            selectedEmoji = emoji;
            document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // 기록 저장 (추가 및 수정)
        saveBtn.addEventListener('click', () => {
            const content = diaryInput.value.trim();
            
            if (!selectedEmoji) {
                alert('오늘의 감정을 선택해 주세요.');
                return;
            }
            if (!content) {
                alert('기록할 내용을 적어주세요.');
                return;
            }

            let diaries = JSON.parse(localStorage.getItem('diaries') || '[]');

            if (editingId) {
                // 수정 모드
                diaries = diaries.map(item => {
                    if (item.id === editingId) {
                        return { ...item, emoji: selectedEmoji, content: content };
                    }
                    return item;
                });
                editingId = null;
                saveBtn.innerText = '기록하기';
            } else {
                // 신규 저장
                const newDiary = {
                    id: Date.now(),
                    date: new Date().toLocaleString('ko-KR'),
                    emoji: selectedEmoji,
                    content: content
                };
                diaries.unshift(newDiary);
            }

            localStorage.setItem('diaries', JSON.stringify(diaries));
            resetEditor();
            loadDiaries();
        });

        function resetEditor() {
            diaryInput.value = '';
            selectedEmoji = '';
            document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('active'));
            editingId = null;
            saveBtn.innerText = '기록하기';
        }

        // 목록 로드
        function loadDiaries() {
            const diaries = JSON.parse(localStorage.getItem('diaries') || '[]');
            timeline.innerHTML = '';

            diaries.forEach(item => {
                const element = document.createElement('div');
                element.className = 'diary-item';
                element.innerHTML = `
                    <div class="diary-card">
                        <div class="diary-header">
                            <div class="diary-info">
                                <span class="diary-date">${item.date}</span>
                                <span class="diary-emoji">${item.emoji}</span>
                            </div>
                        </div>
                        <div class="diary-content">${item.content}</div>
                        <div class="diary-actions">
                            <button class="action-btn" onclick="editDiary(${item.id})">수정</button>
                            <button class="action-btn" onclick="deleteDiary(${item.id}, this)">삭제</button>
                        </div>
                    </div>
                `;
                timeline.appendChild(element);
            });
        }

        // 삭제 기능
        function deleteDiary(id, btn) {
            if (!confirm('기록을 지우시겠습니까?')) return;
            
            const itemElement = btn.closest('.diary-item');
            itemElement.classList.add('removing');
            
            setTimeout(() => {
                let diaries = JSON.parse(localStorage.getItem('diaries') || '[]');
                diaries = diaries.filter(item => item.id !== id);
                localStorage.setItem('diaries', JSON.stringify(diaries));
                loadDiaries();
            }, 400);
        }

        // 수정 기능
        function editDiary(id) {
            const diaries = JSON.parse(localStorage.getItem('diaries') || '[]');
            const item = diaries.find(d => d.id === id);
            
            if (item) {
                diaryInput.value = item.content;
                selectedEmoji = item.emoji;
                editingId = id;
                saveBtn.innerText = '수정 완료하기';
                
                // 해당 이모지 버튼 활성화
                document.querySelectorAll('.emoji-btn').forEach(btn => {
                    if (btn.innerText === item.emoji) btn.classList.add('active');
                    else btn.classList.remove('active');
                });

                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
